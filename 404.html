<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UFC Mania</title>
  <script>
    // ----------------------------------------------------------------------------
    // Single Page Application SPA Redirect for GitHub Pages
    // Converts direct route requests (e.g. /cart, /shop) to index.html?p=/cart
    // so that clean BrowserRouter routes work on direct refresh without 404 errors.
    // ----------------------------------------------------------------------------
    (function(){
      var path = window.location.pathname;
      var repo = '/UFC-mania-test';
      var basePath = path.startsWith(repo) ? repo : '';
      var route = path.substring(basePath.length);
      var query = window.location.search ? window.location.search : '';
      var hash = window.location.hash || '';

      // Avoid redirect loops if already on index.html
      if(route === '' || route === '/' || route === '/index.html'){
        window.location.replace(basePath + '/' + query + hash);
        return;
      }

      var separator = query ? '&' : '?';
      var redirectUrl = basePath + '/' + (query ? query + '&' : '?') + 'p=' + encodeURIComponent(route) + hash;
      window.location.replace(redirectUrl);
    })();
  </script>
</head>
<body style="background:#0a0a0c;color:#fff;font-family:sans-serif;text-align:center;padding-top:60px;">
  <p>Loading UFC Mania...</p>
</body>
</html>
