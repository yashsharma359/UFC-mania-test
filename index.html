<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UFC Mania — Explore UFC Fighters Around the World</title>
<meta name="description" content="UFC Mania: browse UFC fighters, compare stats, and explore rankings, weight classes and countries. Demo dataset for a scalable fighter database platform.">
<meta property="og:title" content="UFC Mania — Explore UFC Fighters Around the World">
<meta property="og:description" content="Browse UFC fighters, compare stats, and explore rankings, weight classes and countries on UFC Mania.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="UFC Mania">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="UFC Mania — Explore UFC Fighters Around the World">
<meta name="twitter:description" content="Browse UFC fighters, compare stats, and explore rankings, weight classes and countries on UFC Mania.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b;
  --surface:#141416;
  --surface-2:#1c1c1f;
  --line:#2b2b2f;
  --red:#e0102b;
  --red-dim:#8c0c1c;
  --gold:#c9a227;
  --white:#f4f4f2;
  --muted:#9a9aa1;
  --muted-2:#616166;
  --win:#2f9e5b;
  --loss:#c9372c;
  --draw:#c9a227;
  --nc:#6b6b70;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:70px;height:100%;}
*,*::before,*::after{box-sizing:inherit;}
body{
  margin:0;background:var(--bg);color:var(--white);
  -webkit-font-smoothing:antialiased;
  min-height:100%;
  overflow-x:hidden;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
h1,h2,h3,h4{font-family:'Oswald',sans-serif;margin:0;letter-spacing:.01em;}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px;}
.hidden{display:none !important;}

/* ===== ANIMATED BACKGROUND CANVAS ===== */
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
#nav,#searchOverlay,main,footer{position:relative;z-index:1;}

/* ===== KEYFRAME ANIMATIONS ===== */
@keyframes float-y{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes rotate-slow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes glow-pulse{0%,100%{box-shadow:0 4px 20px rgba(224,16,43,.45),0 1px 4px rgba(0,0,0,.4)}50%{box-shadow:0 6px 36px rgba(224,16,43,.75),0 1px 4px rgba(0,0,0,.4)}}
@keyframes border-spin{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes fade-in-up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes scanline{0%{top:-5%}100%{top:105%}}
@keyframes logo-glow{0%,100%{box-shadow:0 0 10px rgba(224,16,43,.4)}50%{box-shadow:0 0 24px rgba(224,16,43,.9),0 0 40px rgba(224,16,43,.4)}}
@keyframes card-appear{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}



/* ---------- NAV ---------- */
#nav{
  position:sticky;top:0;top:env(safe-area-inset-top,0px);z-index:100;
  background:rgba(8,8,9,.78);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid rgba(224,16,43,.18);
}
#nav::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(224,16,43,.5),transparent);}
#nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;}
.logo{display:flex;align-items:center;gap:10px;font-family:'Oswald';font-weight:600;font-size:18px;}
.logo .mark{width:32px;height:32px;border-radius:4px;background:linear-gradient(135deg,var(--red),#ff2020,var(--red-dim));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;font-family:'Oswald';transform:skew(-6deg);animation:logo-glow 2.5s ease-in-out infinite;}
.navlinks{display:flex;gap:2px;align-items:center;}
.navlinks a{padding:10px 14px;font-size:14px;font-weight:500;color:var(--muted);border-radius:6px;transition:color .2s,background .2s;position:relative;}
.navlinks a::after{content:'';position:absolute;bottom:4px;left:50%;right:50%;height:2px;background:var(--red);border-radius:2px;transition:left .2s,right .2s;}
.navlinks a:hover::after,.navlinks a.active::after{left:14px;right:14px;}
.navlinks a:hover,.navlinks a.active{color:var(--white);background:rgba(224,16,43,.08);}
.navtools{display:flex;align-items:center;gap:10px;}
#navSearchBtn{background:rgba(224,16,43,.1);border:1px solid rgba(224,16,43,.25);color:var(--muted);width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
#navSearchBtn:hover{color:var(--white);border-color:var(--red);background:rgba(224,16,43,.22);box-shadow:0 0 12px rgba(224,16,43,.3);}
.burger{display:none;background:none;border:none;color:var(--white);width:38px;height:38px;}
@media(max-width:900px){
  .navlinks{display:none;position:absolute;top:64px;left:0;right:0;background:rgba(8,8,9,.97);flex-direction:column;border-bottom:1px solid var(--line);padding:8px;backdrop-filter:blur(20px);}
  .navlinks.open{display:flex;}
  .burger{display:flex;align-items:center;justify-content:center;}
}


/* global search overlay */
#searchOverlay{position:fixed;inset:0;background:rgba(8,8,9,.92);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding-top:14vh;}
#searchOverlay .box{width:min(560px,90vw);}
#searchOverlay input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;color:var(--white);font-size:18px;outline:none;}
#searchOverlay input:focus{border-color:var(--red);}
#searchResults{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:50vh;overflow-y:auto;}
.searchRow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);}
.searchRow:last-child{border-bottom:none;}
.searchRow:hover{background:var(--surface-2);}
.searchRow img{width:36px;height:36px;border-radius:6px;object-fit:cover;}
#searchClose{position:absolute;top:18px;right:22px;color:var(--muted);background:none;border:none;font-size:26px;}

/* ---------- HERO ---------- */
#hero{
  position:relative;padding:110px 0 96px;overflow:hidden;
  background:
    radial-gradient(ellipse 70% 60% at 80% -10%, rgba(224,16,43,.22), transparent 65%),
    radial-gradient(ellipse 50% 40% at 10% 110%, rgba(201,162,39,.10), transparent 60%),
    var(--bg);
}
#hero::before{content:'';position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,rgba(224,16,43,.35),transparent);animation:scanline 5s linear infinite;z-index:2;pointer-events:none;}
#hero .cage{position:absolute;right:-100px;top:-60px;width:680px;height:680px;opacity:.22;pointer-events:none;animation:rotate-slow 80s linear infinite;}
#hero .cage svg{width:100%;height:100%;}
#hero .orb1{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(224,16,43,.12) 0%,transparent 70%);top:-100px;right:100px;animation:float-y 8s ease-in-out infinite;pointer-events:none;}
#hero .orb2{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,39,.08) 0%,transparent 70%);bottom:-80px;left:60px;animation:float-y 11s ease-in-out infinite reverse;pointer-events:none;}
.eyebrow{color:var(--red);font-weight:700;font-size:12px;letter-spacing:.14em;margin-bottom:18px;display:flex;align-items:center;gap:10px;text-transform:uppercase;animation:fade-in-up .6s ease both;}
.eyebrow::before{content:'';width:28px;height:2px;background:linear-gradient(90deg,var(--red),transparent);display:inline-block;}
.eyebrow::after{content:'';width:28px;height:2px;background:linear-gradient(270deg,var(--red),transparent);display:inline-block;}
#hero h1{font-size:clamp(38px,6vw,68px);line-height:1.02;max-width:820px;font-weight:700;animation:fade-in-up .7s .1s ease both;text-shadow:0 2px 40px rgba(0,0,0,.5);}
#hero h1 em{font-style:normal;color:var(--red);position:relative;}
#hero h1 em::after{content:'';position:absolute;left:0;bottom:-4px;right:0;height:3px;background:linear-gradient(90deg,var(--red),rgba(224,16,43,.3));border-radius:2px;}
#hero p.lead{color:var(--muted);font-size:18px;max-width:560px;margin-top:26px;line-height:1.6;animation:fade-in-up .7s .2s ease both;}
.btnrow{display:flex;gap:16px;margin-top:38px;flex-wrap:wrap;animation:fade-in-up .7s .3s ease both;}

/* ---------- BUTTONS ---------- */
.btn{
  padding:13px 28px;border-radius:10px;font-weight:700;font-size:13.5px;
  border:none;transition:transform .15s,box-shadow .2s,filter .2s;
  display:inline-flex;align-items:center;gap:9px;
  cursor:pointer;letter-spacing:.04em;text-transform:uppercase;
  font-family:'Oswald',sans-serif;position:relative;overflow:hidden;
}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.13) 50%,transparent 70%);transform:translateX(-100%);transition:transform .45s ease;}
.btn:hover::before{transform:translateX(100%);}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg,#ff1a2e,#e0102b,#b80d22);color:#fff;animation:glow-pulse 3s ease-in-out infinite;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--white);border:1px solid rgba(255,255,255,.18);position:relative;}
.btn-ghost::after{content:'';position:absolute;inset:-1px;border-radius:11px;background:linear-gradient(90deg,rgba(224,16,43,0),rgba(224,16,43,.5),rgba(201,162,39,.4),rgba(224,16,43,.5),rgba(224,16,43,0));background-size:300% 100%;animation:border-spin 4s linear infinite;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;-webkit-mask-composite:xor;padding:1px;}
.btn-ghost:hover{background:rgba(224,16,43,.1);border-color:rgba(224,16,43,.4);box-shadow:0 0 18px rgba(224,16,43,.2);}

.heroStats{display:flex;gap:40px;margin-top:60px;flex-wrap:wrap;animation:fade-in-up .7s .45s ease both;}
.heroStats .n{font-family:'Oswald';font-size:32px;font-weight:700;}
.heroStats .l{color:var(--muted);font-size:12px;margin-top:4px;text-transform:uppercase;letter-spacing:.06em;}
.heroSearch{margin-top:44px;max-width:480px;position:relative;animation:fade-in-up .7s .35s ease both;}
.heroSearch input{width:100%;background:rgba(20,20,22,.85);border:1px solid rgba(224,16,43,.25);border-radius:12px;padding:15px 18px 15px 48px;color:var(--white);font-size:15px;backdrop-filter:blur(10px);transition:border-color .2s,box-shadow .2s;}
.heroSearch input:focus{outline:none;border-color:var(--red);box-shadow:0 0 18px rgba(224,16,43,.2);}
.heroSearch svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--red);}

/* ---------- SECTIONS ---------- */
section.pad{padding:72px 0;}
.sectionHead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:32px;gap:20px;flex-wrap:wrap;}
.sectionHead h2{font-size:30px;font-weight:700;position:relative;display:inline-block;padding-bottom:8px;}
.sectionHead h2::after{content:'';position:absolute;left:0;bottom:0;width:40px;height:3px;background:linear-gradient(90deg,var(--red),rgba(224,16,43,.3));border-radius:2px;}
.sectionHead p{color:var(--muted);font-size:14px;margin-top:8px;}
.sectionHead a.more{color:var(--red);font-size:13px;font-weight:700;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;padding:8px 16px;border:1px solid rgba(224,16,43,.3);border-radius:8px;transition:all .2s;}
.sectionHead a.more:hover{background:rgba(224,16,43,.1);border-color:var(--red);box-shadow:0 0 14px rgba(224,16,43,.2);}


/* fighter card grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .18s,border-color .18s;position:relative;}
.fcard:hover{transform:translateY(-4px);border-color:var(--muted-2);}
.fcard .photo{position:relative;height:220px;background:linear-gradient(160deg,#232326,#0f0f11);overflow:hidden;}
.fcard .photo img{width:100%;height:100%;object-fit:cover;object-position:top center;}
.fcard .statusPill{position:absolute;top:10px;left:10px;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);}
.statusPill.active{color:#7ee0a1;border:1px solid #2f9e5b;}
.statusPill.retired{color:#c9a227;border:1px solid #7a641c;}
.statusPill.former{color:#c98f8f;border:1px solid #7a2f2f;}
.fcard .flag{position:absolute;top:10px;right:10px;font-size:20px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));}
.fcard .body{padding:14px 16px 16px;}
.fcard .nick{color:var(--red);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.fcard h3{font-size:19px;margin-top:3px;font-weight:600;}
.fcard .meta{display:flex;gap:8px;color:var(--muted);font-size:12.5px;margin-top:6px;flex-wrap:wrap;}
.fcard .meta span:not(:last-child)::after{content:'•';margin-left:8px;color:var(--muted-2);}
.fcard .record{font-family:'Oswald';font-size:15px;margin-top:12px;letter-spacing:.02em;}
.fcard .record b{color:var(--win);}
.fcard .record .l{color:var(--loss);}
.fcard .record .d{color:var(--muted);}
.fcard .viewBtn{display:block;text-align:center;margin-top:12px;padding:9px;border-radius:7px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--white);}
.fcard .viewBtn:hover{background:var(--red);border-color:var(--red);}

/* filter bar */
.filterBar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:26px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;}
.filterBar input[type=text]{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--white);font-size:14px;min-width:200px;flex:1;}
.filterBar select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--white);font-size:13px;}
.chipRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px;}
.chip{padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);}
.chip:hover{color:var(--white);}
.chip.active{background:var(--red);border-color:var(--red);color:#fff;}
.resultCount{color:var(--muted);font-size:13px;margin:2px 0 18px;}

/* country / weightclass pill grids */
.pillGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.countryPill,.wcPill{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;transition:border-color .15s,transform .15s;}
.countryPill:hover,.wcPill:hover{border-color:var(--red);transform:translateY(-2px);}
.countryPill .name,.wcPill .name{font-weight:600;font-size:14.5px;}
.countryPill .flag{font-size:22px;margin-right:10px;}
.countryPill .count,.wcPill .count{color:var(--muted);font-size:13px;}

/* ---------- PROFILE ---------- */
#profileHero{position:relative;padding:48px 0 0;background:linear-gradient(180deg,rgba(224,16,43,.10),transparent 60%);}
.backlink{color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:6px;margin-bottom:22px;}
.backlink:hover{color:var(--white);}
.profileTop{display:flex;gap:32px;align-items:flex-end;flex-wrap:wrap;padding-bottom:32px;border-bottom:1px solid var(--line);}
.profileTop .photo{width:180px;height:220px;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--surface-2);border:1px solid var(--line);}
.profileTop .photo img{width:100%;height:100%;object-fit:cover;object-position:top center;}
.profileTop--stacked{flex-direction:column;align-items:center;text-align:center;padding-bottom:36px;}
.profileTop--stacked .photo--lg{width:220px;height:280px;}
.profileTop--stacked .subline{justify-content:center;}
.profileTop--stacked .recordBig{white-space:normal;}
.photoSrcLink{display:inline-block;margin-top:10px;font-size:12px;color:var(--muted);border-bottom:1px dotted var(--muted-2);}
.photoSrcLink:hover{color:var(--white);}
.profileTop .info .nick{color:var(--red);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.04em;}
.profileTop h1{font-size:clamp(28px,4vw,42px);margin-top:4px;}
.profileTop .subline{color:var(--muted);font-size:14.5px;margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.tag{padding:4px 10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;}
.tag.status-active{color:#7ee0a1;border-color:#2f9e5b;}
.tag.status-retired{color:#c9a227;border-color:#7a641c;}
.tag.status-former{color:#c98f8f;border-color:#7a2f2f;}
.recordBig{font-family:'Oswald';font-size:34px;font-weight:600;white-space:nowrap;}
.recordBig .l{color:var(--loss);}
.recordBig .d{color:var(--muted);font-size:.7em;}

.tabs{display:flex;gap:4px;overflow-x:auto;padding:18px 0;border-bottom:1px solid var(--line);position:sticky;top:64px;top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--bg);z-index:40;}
.tabBtn{padding:9px 16px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;background:none;border:none;}
.tabBtn:hover{color:var(--white);}
.tabBtn.active{background:var(--surface-2);color:var(--white);}

.tabPanel{padding:36px 0;display:none;}
.tabPanel.active{display:block;}
.panelGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.statBox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
.statBox .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;}
.statBox .v{font-family:'Oswald';font-size:22px;margin-top:5px;font-weight:600;}

.bioGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;}
@media(max-width:640px){.bioGrid{grid-template-columns:1fr;}}
.bioRow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;gap:10px;}
.bioRow .k{color:var(--muted);}
.bioRow .v{text-align:right;font-weight:500;}

.subhead{font-size:16px;font-weight:600;margin:30px 0 14px;color:var(--white);border-left:3px solid var(--red);padding-left:10px;}
.subhead:first-child{margin-top:0;}
.na{color:var(--muted-2);font-style:italic;font-size:14px;}

/* timeline */
.timeline{position:relative;padding-left:26px;}
.timeline::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line);}
.tItem{position:relative;padding-bottom:26px;}
.tItem::before{content:'';position:absolute;left:-26px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--bg);}
.tItem.loss::before{background:var(--muted-2);}
.tItem .row1{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.tItem .date{color:var(--muted);font-size:12.5px;}
.tItem h4{font-size:16px;margin-top:4px;}
.tItem .sub{color:var(--muted);font-size:13px;margin-top:3px;}
.badgeRow{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.mini{font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--gold);}

/* fight history table */
table.fh{width:100%;border-collapse:collapse;font-size:13.5px;}
table.fh th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--line);}
table.fh td{padding:12px;border-bottom:1px solid var(--line);}
table.fh tr:hover td{background:var(--surface);}
.resBadge{display:inline-block;padding:3px 10px;border-radius:5px;font-weight:700;font-size:11.5px;}
.resBadge.win{background:rgba(47,158,91,.18);color:var(--win);}
.resBadge.loss{background:rgba(201,55,44,.18);color:var(--loss);}
.resBadge.draw{background:rgba(201,162,39,.18);color:var(--draw);}
.resBadge.nc{background:rgba(107,107,112,.18);color:var(--nc);}
.tableScroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}

.newsItem{padding:18px 0;border-bottom:1px solid var(--line);}
.newsItem .date{color:var(--muted);font-size:12px;}
.newsItem h4{margin-top:5px;font-size:16px;}
.newsItem p{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.5;}
.newsItem .src{color:var(--muted-2);font-size:12px;margin-top:6px;}

.sourceBox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;font-size:13.5px;color:var(--muted);}
.sourceBox ul{margin:8px 0 0;padding-left:18px;}
.sourceBox li{margin-bottom:4px;}
.updated{color:var(--gold);font-weight:600;}

/* rankings table */
.rankRow{display:flex;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line);}
.rankRow:hover{background:var(--surface);}
.rankNum{font-family:'Oswald';font-size:20px;width:34px;color:var(--muted);}
.rankNum.champ{color:var(--gold);}
.rankRow img{width:40px;height:40px;border-radius:6px;object-fit:cover;}
.rankRow .nm{font-weight:600;font-size:14.5px;flex:1;}
.rankRow .rec{color:var(--muted);font-size:13px;}

/* compare */
.compareSelectRow{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:36px;}
.compareSelectRow select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--white);font-size:14px;min-width:220px;}
.vsMark{font-family:'Oswald';color:var(--red);font-size:22px;font-weight:600;}
table.cmp{width:100%;border-collapse:collapse;}
table.cmp td,table.cmp th{padding:13px 14px;border-bottom:1px solid var(--line);font-size:14px;}
table.cmp th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;text-align:center;width:22%;}
table.cmp td.label{color:var(--muted);width:26%;font-size:13px;}
table.cmp td.val{text-align:center;font-weight:600;}
table.cmp td.win{color:var(--win);}
.cmpHead{display:flex;flex-direction:column;align-items:center;gap:8px;}
.cmpHead img{width:64px;height:64px;border-radius:8px;object-fit:cover;}

footer{border-top:1px solid var(--line);padding:40px 0;margin-top:40px;color:var(--muted-2);font-size:13px;}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;}
.demoNote{background:rgba(201,162,39,.08);border:1px solid rgba(201,162,39,.35);color:#d8bd5f;border-radius:10px;padding:14px 18px;font-size:13px;margin-bottom:28px;line-height:1.55;}

@media(max-width:640px){
  .wrap{padding:0 16px;}
  #hero{padding:64px 0 56px;}
  .profileTop{gap:20px;}
  .profileTop .photo{width:130px;height:160px;}
  .recordBig{font-size:24px;}
}
</style>

// PHOTO SCHEMA NOTE
// Each fighter carries photo_url / photo_source / photo_license / photo_attribution
// fields (photoUrl / photoSource / photoLicense / photoAttribution here). They are
// left null in this demo: see the assistant's reply for why real photos aren't
// hotlinked in this build, and how to populate them for your own deployment.
// When photoUrl is null (or fails to load), the UI automatically falls back to a
// branded "UFC MANIA + initials" placeholder — never a broken-image icon.

<script>
// ============================================================================
// APP LOGIC — vanilla JS SPA, hash-based routing
// ============================================================================
const app = document.getElementById('app');

// ---------- helpers ----------
function initials(name){
  return name.split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
function hashHue(str){
  let h=0; for(let i=0;i<str.length;i++){ h = str.charCodeAt(i) + ((h<<5)-h); }
  return Math.abs(h)%360;
}
// Branded "UFC MANIA + initials" fallback — shown whenever a fighter has no
// photoUrl, or their photoUrl fails to load. Never a broken-image icon.
function fallbackAvatarHTML(f, size){
  const hue = hashHue(f.weightClass+f.country);
  const s = size||34;
  return `<div class="fallback" style="position:absolute;inset:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:${Math.max(2,s*.12)}px;
    background:linear-gradient(150deg,hsl(${hue} 55% 20%),hsl(${(hue+40)%360} 65% 12%));">
    <div style="font-family:'Oswald';font-weight:600;color:rgba(255,255,255,.94);font-size:${s}px;letter-spacing:.02em;line-height:1;">${initials(f.name)}</div>
    <div style="font-family:'Oswald';font-weight:600;color:rgba(255,255,255,.5);font-size:${Math.max(8,s*.24)}px;letter-spacing:.12em;">UFC MANIA</div>
  </div>`;
}
// Kept for any legacy callers: same signature as before, avatar-only (no wordmark).
function avatarHTML(f, size){
  const hue = hashHue(f.weightClass+f.country);
  return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,hsl(${hue} 55% 20%),hsl(${(hue+40)%360} 65% 12%));
    font-family:'Oswald';font-weight:600;color:rgba(255,255,255,.88);font-size:${size||34}px;letter-spacing:.02em;">
    ${initials(f.name)}</div>`;
}
// Real photo (if present) stacked over the branded fallback, with automatic
// onerror fallback, lazy loading, and a fixed-ratio container to avoid layout shift.
function photoBox(f, size){
  const hue = hashHue((f.weightClass||'')+(f.country||''));
  const fallback = fallbackAvatarHTML(f, size);
  if (!f.photoUrl) {
    return `<div style="position:relative;width:100%;height:100%;overflow:hidden;">${fallback}</div>`;
  }
  const img = `<img src="${f.photoUrl}" alt="${f.name} - UFC fighter photo" loading="lazy" decoding="async"
         style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;z-index:2;"
         onload="const p=this.previousElementSibling;if(p)p.style.display='none';"
         onerror="this.style.display='none';const p=this.previousElementSibling;if(p)p.style.display='';">`;
  return `<div style="position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(150deg,hsl(${hue} 45% 16%),hsl(${(hue+40)%360} 50% 9%));">${fallback}${img}</div>`;
}
function flag(country){ return COUNTRY_FLAGS[country] || '🏳️'; }
function statusClass(status){ return status==='active'?'active':(status==='retired'?'retired':'former'); }
function recBadge(r){ return `<span class="record"><b>${r.w}</b>-<span class="l">${r.l}</span>-<span class="d">${r.d}</span>${r.nc?` <span class="d">(${r.nc} NC)</span>`:''}</span>`; }
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
}
function age(dob){
  const b = new Date(dob); const t = new Date();
  let a = t.getFullYear()-b.getFullYear();
  if(t.getMonth()<b.getMonth() || (t.getMonth()===b.getMonth() && t.getDate()<b.getDate())) a--;
  return a;
}
function byId(id){ return FIGHTERS.find(f=>f.id===id); }
function resClass(r){ return r==='win'?'win':r==='loss'?'loss':r==='draw'?'draw':'nc'; }
function resLabel(r){ return r==='win'?'Win':r==='loss'?'Loss':r==='draw'?'Draw':'No Contest'; }

const WEIGHT_CLASSES = [...new Set(FIGHTERS.map(f=>f.weightClass))];
const COUNTRIES = [...new Set(FIGHTERS.map(f=>f.country))];

function countryCount(c){ return FIGHTERS.filter(f=>f.country===c).length; }
function wcCount(w){ return FIGHTERS.filter(f=>f.weightClass===w).length; }

// ---------- fighter card ----------
function fighterCard(f){
  return `<a class="fcard" href="#/fighter/${f.id}">
    <div class="photo">
      ${photoBox(f,40)}
      <span class="statusPill ${statusClass(f.status)}">${f.statusLabel}</span>
      <span class="flag" title="${f.country}">${flag(f.country)}</span>
    </div>
    <div class="body">
      <div class="nick">${f.nickname && f.nickname!=='—' ? '"'+f.nickname+'"' : '&nbsp;'}</div>
      <h3>${f.name}</h3>
      <div class="meta"><span>${flag(f.country)} ${f.country}</span><span>${f.weightClass}</span></div>
      ${recBadge(f.record)}
      <span class="viewBtn">View Profile</span>
    </div>
  </a>`;
}

// ============================================================================

  app.innerHTML = `
  <section id="hero">

    <div class="wrap">

  <section class="pad wrap">

  <section class="pad wrap">
    <div class="sectionHead">
      <div><h2>Popular Fighters</h2><p>Featured active competitors from the current database</p></div>

    <div class="grid">${featured.map(fighterCard).join('')}</div>

  <section class="pad wrap">

    </div>
    <div class="grid">${recent.map(fighterCard).join('')}</div>
  </section>

  <section class="pad wrap">
    <div class="sectionHead">
      <div><h2>Browse by Country</h2><p>Fighters grouped by nationality</p></div>
      <a class="more" href="#/countries">All countries →</a>
    </div>
    <div class="pillGrid">
      ${topCountries.map(c=>`<a class="countryPill" href="#/fighters?country=${encodeURIComponent(c)}">
        <span><span class="flag">${flag(c)}</span><span class="name">${c}</span></span>
        <span class="count">${countryCount(c)} fighters</span>
      </a>`).join('')}
    </div>
  </section>

  <section class="pad wrap">
    <div class="sectionHead">
      <div><h2>Browse by Weight Class</h2><p>All divisions represented in the database</p></div>
      <a class="more" href="#/weightclasses">All divisions →</a>
    </div>
    <div class="pillGrid">
      ${topWc.map(w=>`<a class="wcPill" href="#/fighters?wc=${encodeURIComponent(w)}">
        <span class="name">${w}</span><span class="count">${wcCount(w)}</span>
      </a>`).join('')}
    </div>
  </section>
  `;

  document.getElementById('heroSearchInput').addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.value.trim()){
      location.hash = '#/fighters?q='+encodeURIComponent(e.target.value.trim());
    }
  });
}

// ---------------- Fighters list ----------------
let listState = { q:'', status:'all', gender:'all', wc:'all', country:'all', sort:'name' };

function parseQuery(q){
  const params = {};
  (q||'').replace(/^\?/,'').split('&').filter(Boolean).forEach(pair=>{
    const [k,v] = pair.split('=');
    params[decodeURIComponent(k)] = decodeURIComponent(v||'');
  });
  return params;
}

function renderFightersList(queryString){
  const params = parseQuery(queryString);
  listState.q = params.q || '';
  if(params.country) listState.country = params.country;
  if(params.wc) listState.wc = params.wc;

  app.innerHTML = `
  <section class="pad wrap">
    <div class="sectionHead"><div><h2>All Fighters</h2><p id="fCount"></p></div></div>

    <div class="filterBar">
      <input type="text" id="fSearch" placeholder="Search fighter by name..." value="${listState.q}">
      <select id="fCountry"><option value="all">All Countries</option>${COUNTRIES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
      <select id="fWc"><option value="all">All Weight Classes</option>${WEIGHT_CLASSES.map(w=>`<option value="${w}">${w}</option>`).join('')}</select>
      <select id="fSort">
        <option value="name">Sort: Name (A–Z)</option>
        <option value="wins">Sort: Most Wins</option>
        <option value="ufcFights">Sort: Most UFC Fights</option>
      </select>
    </div>
    <div class="chipRow" id="statusChips">
      ${[['all','All Fighters'],['active','Active'],['former','Former'],['retired','Retired'],['male','Male'],['female','Female']].map(([k,l])=>
        `<button class="chip" data-key="${k.match(/male|female/)?'gender':'status'}" data-val="${k}">${l}</button>`).join('')}
    </div>
    <div class="chipRow" id="wcChips" style="margin-top:8px;">
      ${WEIGHT_CLASSES.map(w=>`<button class="chip" data-key="wc" data-val="${w}">${w}</button>`).join('')}
    </div>

    <div class="grid" id="fGrid" style="margin-top:26px;"></div>
    <div id="emptyState" class="hidden" style="text-align:center;padding:60px 0;color:var(--muted);">
      No fighters match those filters. Try clearing a filter or searching a different name.
    </div>
  </section>`;

  function syncChips(){
    document.querySelectorAll('#statusChips .chip, #wcChips .chip').forEach(ch=>{
      const active = (ch.dataset.key==='status' && listState.status===ch.dataset.val) ||
                     (ch.dataset.key==='gender' && listState.gender===ch.dataset.val) ||
                     (ch.dataset.key==='wc' && listState.wc===ch.dataset.val);
      ch.classList.toggle('active', active);
    });
    document.getElementById('fCountry').value = listState.country;
    document.getElementById('fWc').value = listState.wc==='all'?'all':listState.wc;
  }

  function applyAndRender(){
    let list = FIGHTERS.filter(f=>{
      if(listState.q && !f.name.toLowerCase().includes(listState.q.toLowerCase()) && !(f.nickname||'').toLowerCase().includes(listState.q.toLowerCase())) return false;
      if(listState.status!=='all'){
        if(listState.status==='active' && f.status!=='active') return false;
        if(listState.status==='former' && f.status!=='former') return false;
        if(listState.status==='retired' && f.status!=='retired') return false;
      }
      if(listState.gender!=='all' && f.gender.toLowerCase()!==listState.gender) return false;
      if(listState.wc!=='all' && f.weightClass!==listState.wc) return false;
      if(listState.country!=='all' && f.country!==listState.country) return false;
      return true;
    });
    if(listState.sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
    if(listState.sort==='wins') list.sort((a,b)=>b.record.w-a.record.w);
    if(listState.sort==='ufcFights') list.sort((a,b)=>b.ufcFights-a.ufcFights);

    document.getElementById('fCount').textContent = `${list.length} of ${FIGHTERS.length} fighters shown`;
    document.getElementById('fGrid').innerHTML = list.map(fighterCard).join('');
    document.getElementById('emptyState').classList.toggle('hidden', list.length>0);
    syncChips();
  }

  document.getElementById('fSearch').addEventListener('input', e=>{ listState.q=e.target.value; applyAndRender(); });
  document.getElementById('fCountry').addEventListener('change', e=>{ listState.country=e.target.value; applyAndRender(); });
  document.getElementById('fWc').addEventListener('change', e=>{ listState.wc=e.target.value; applyAndRender(); });
  document.getElementById('fSort').addEventListener('change', e=>{ listState.sort=e.target.value; applyAndRender(); });
  document.querySelectorAll('#statusChips .chip').forEach(ch=>{
    ch.addEventListener('click', ()=>{
      if(ch.dataset.key==='status') listState.status = (listState.status===ch.dataset.val) ? 'all' : ch.dataset.val;
      if(ch.dataset.key==='gender') listState.gender = (listState.gender===ch.dataset.val) ? 'all' : ch.dataset.val;
      applyAndRender();
    });
  });
  document.querySelectorAll('#wcChips .chip').forEach(ch=>{
    ch.addEventListener('click', ()=>{
      listState.wc = (listState.wc===ch.dataset.val) ? 'all' : ch.dataset.val;
      applyAndRender();
    });
  });

  applyAndRender();
}

// ---------------- Compare ----------------
function renderCompare(prefill){
  app.innerHTML = `
  <section class="pad wrap">
    <div class="sectionHead"><div><h2>Compare Fighters</h2><p>Select two fighters to see a side-by-side breakdown</p></div></div>
    <div class="compareSelectRow">
      <select id="cmpA"><option value="">Select fighter A…</option>${FIGHTERS.map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}</select>
      <span class="vsMark">VS</span>
      <select id="cmpB"><option value="">Select fighter B…</option>${FIGHTERS.map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}</select>
    </div>
    <div id="cmpOut"></div>
  </section>`;

  const selA = document.getElementById('cmpA'), selB = document.getElementById('cmpB');
  if(prefill){ selA.value = prefill[0]||''; selB.value = prefill[1]||''; }

  function draw(){
    const a = byId(selA.value), b = byId(selB.value);
    const out = document.getElementById('cmpOut');
    if(!a || !b){ out.innerHTML = '<p style="text-align:center;color:var(--muted);margin-top:20px;">Choose two fighters above to compare.</p>'; return; }
    const rows = [
      ['Age', age(a.dob), age(b.dob), 'high'],
      ['Height', a.height, b.height, 'text'],
      ['Reach', a.reach, b.reach, 'text'],
      ['Weight Class', a.weightClass, b.weightClass, 'text'],
      ['Record', `${a.record.w}-${a.record.l}-${a.record.d}`, `${b.record.w}-${b.record.l}-${b.record.d}`, 'text'],
      ['Wins', a.record.w, b.record.w, 'high'],
      ['Losses', a.record.l, b.record.l, 'low'],
      ['KO Wins', a.koWins, b.koWins, 'high'],
      ['Submission Wins', a.subWins, b.subWins, 'high'],
      ['Decision Wins', a.decWins, b.decWins, 'high'],
      ['UFC Fights', a.ufcFights, b.ufcFights, 'high'],
      ['Title Fights', a.titleFights, b.titleFights, 'high'],
      ['Title Defenses', a.titleDefenses, b.titleDefenses, 'high'],
      ['Ranking', a.ranking.current, b.ranking.current, 'text'],
    ];
    out.innerHTML = `
    <div class="tableScroll" style="margin-top:10px;">
      <table class="cmp">
        <thead><tr><th></th><th><div class="cmpHead">${avatarHTMLsmall(a)}<div>${a.name}</div></div></th><th></th><th><div class="cmpHead">${avatarHTMLsmall(b)}<div>${b.name}</div></div></th></tr></thead>
        <tbody>
          ${rows.map(r=>{
            const [label,va,vb,mode]=r;
            let winA=false,winB=false;
            if(mode==='high' && typeof va==='number'){ winA = va>vb; winB = vb>va; }
            if(mode==='low' && typeof va==='number'){ winA = va<vb; winB = vb<va; }
            return `<tr><td class="label">${label}</td><td class="val ${winA?'win':''}">${va}</td><td class="label" style="text-align:center;">vs</td><td class="val ${winB?'win':''}">${vb}</td></tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
  }
  function avatarHTMLsmall(f){ return `<div style="width:64px;height:64px;border-radius:8px;overflow:hidden;">${photoBox(f,22)}</div>`; }
  selA.addEventListener('change', draw); selB.addEventListener('change', draw);
  draw();
}

// ============================================================================
// ROUTER
// ============================================================================
function setActiveNav(route){
  document.querySelectorAll('.navlinks a').forEach(a=>a.classList.toggle('active', a.dataset.route===route));
}

function router(){
  const hash = location.hash || '#/';
  const [path, query] = hash.replace(/^#/,'').split('?');
  window.scrollTo(0,0);
  document.getElementById('navlinks').classList.remove('open');

  if(path==='/' || path===''){ renderHome(); setActiveNav('home'); return; }
  if(path==='/fighters'){ renderFightersList(query); setActiveNav('fighters'); return; }
  if(path.startsWith('/fighter/')){ renderProfile(path.split('/')[2]); setActiveNav('fighters'); return; }
  if(path==='/countries'){ renderCountries(); setActiveNav('countries'); return; }
  if(path==='/weightclasses'){ renderWeightClasses(); setActiveNav('weightclasses'); return; }
  if(path==='/rankings'){ renderRankings(); setActiveNav('rankings'); return; }
  if(path==='/news'){ renderNews(); setActiveNav('news'); return; }
  if(path==='/compare'){
    const params = parseQuery(query);
    renderCompare(params.a || params.b ? [params.a,params.b] : null);
    setActiveNav('compare'); return;
  }
  // fallback
  renderHome(); setActiveNav('home');
}
window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', router);
router();

// ============================================================================
// NAV / SEARCH CHROME
// ============================================================================
document.getElementById('burgerBtn').addEventListener('click', ()=>{
  document.getElementById('navlinks').classList.toggle('open');
});

const overlay = document.getElementById('searchOverlay');
const gInput = document.getElementById('globalSearchInput');
function openSearch(){
  overlay.classList.remove('hidden');
  setTimeout(()=>gInput.focus(),30);
}
function closeSearch(){ overlay.classList.add('hidden'); gInput.value=''; document.getElementById('searchResults').innerHTML=''; }
document.getElementById('navSearchBtn').addEventListener('click', openSearch);
document.getElementById('searchClose').addEventListener('click', closeSearch);
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeSearch(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSearch(); });

gInput.addEventListener('input', ()=>{
  const q = gInput.value.trim().toLowerCase();
  const box = document.getElementById('searchResults');
  if(!q){ box.innerHTML=''; return; }
  const matches = FIGHTERS.filter(f=>f.name.toLowerCase().includes(q) || (f.nickname||'').toLowerCase().includes(q)).slice(0,8);
  box.innerHTML = matches.length ? matches.map(f=>`<a class="searchRow" href="#/fighter/${f.id}">
      <div style="width:36px;height:36px;border-radius:6px;overflow:hidden;">${photoBox(f,13)}</div>
      <div><div style="font-weight:600;font-size:14px;">${f.name}</div><div style="color:var(--muted);font-size:12px;">${f.weightClass} • ${f.country}</div></div>
    </a>`).join('') : `<div style="padding:16px;color:var(--muted);font-size:14px;">No fighters found for "${gInput.value}"</div>`;
});
gInput.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const first = document.querySelector('#searchResults .searchRow');
    if(first){ location.hash = first.getAttribute('href'); closeSearch(); }
  }
});
document.querySelectorAll('#searchResults').forEach(el=>el.addEventListener('click', closeSearch));
app.addEventListener('click', ()=>{}); // no-op, placeholder for delegation safety

</script>
</body>
</html>
